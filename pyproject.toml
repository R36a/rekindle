[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rekindle"
version = "0.1.0"
description = "本地优先的个人人脉管理器：一句话记人，靠提醒维持联系"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "TBD" }
dependencies = [
    # 领域模型与校验：核心，不引入框架
    "pydantic>=2.7",
]

[project.optional-dependencies]
# LLM 抽取（阶段 2 起使用）
llm = ["httpx>=0.27"]
# 图形界面（阶段 3 起使用）
# 只要 Essentials：QtWidgets/QtGui 足够做托盘、全局热键、气泡通知；
# 不装 PySide6_Addons/WebEngine/Pdf，省数百 MB。已实测 6.12 的 cp310-abi3 wheel 在 Python 3.14 可用。
gui = ["PySide6-Essentials>=6.12"]
# 开发期工具
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
rekindle = "rekindle.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
