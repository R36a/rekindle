[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rekindle"
dynamic = ["version"]  # 版本号单一来源在 src/rekindle/__init__.py，见下方 [tool.setuptools.dynamic]
description = "本地优先的个人人脉管理器：一句话记人，随时找得到"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    # 领域模型与校验：核心，不引入框架
    "pydantic>=2.7",
]

[project.optional-dependencies]
# LLM 抽取（阶段 2 起使用）
# 注意：mypy 会检查 src/rekindle/infra/llm_http.py，所以开发环境要带这个 extra
# （README 与 CI 都用 pip install -e ".[dev,llm,api]"）。
llm = ["httpx>=0.27"]
# 图形界面（阶段 3 起使用）
# 只要 Essentials：QtWidgets/QtGui 足够做托盘、全局热键、气泡通知；
# 不装 PySide6_Addons/WebEngine/Pdf，省数百 MB。已实测 6.12 的 cp310-abi3 wheel 在 Python 3.14 可用。
gui = ["PySide6-Essentials>=6.12"]
# HTTP API（可选）：复用 app/ 用例层，核心逻辑不变
# 注意：mypy 会检查、测试会运行 interfaces/api.py，所以开发环境要带这个 extra
# （README 与 CI 都用 pip install -e ".[dev,llm,api]"）。
api = ["fastapi>=0.115", "uvicorn>=0.30"]
# 打包 Windows exe（tools/build_exe.ps1 使用）
build = ["pyinstaller>=6.22"]
# 开发期工具
# 钉住 ruff / mypy 的版本：这两个工具换个小版本就可能新增检查项，
# 不钉住会出现「本地绿、CI 红」的假故障（本次就踩到了）。
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.17.2", "mypy==2.4.0"]

[project.scripts]
rekindle = "rekindle.__main__:main"
rekindle-api = "rekindle.interfaces.api:main"

[project.gui-scripts]
# 双击启动的图形界面（Windows 下生成 .exe，不弹控制台）
rekindle-gui = "rekindle.interfaces.gui:main"

[tool.setuptools.dynamic]
# 让打包时从 __init__.py 读取版本号，避免和 pyproject 各写一份造成不一致
version = {attr = "rekindle.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
