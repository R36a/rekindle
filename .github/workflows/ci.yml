# 持续集成：每次 push / PR 自动跑静态检查与测试。
#
# 覆盖率门禁只卡「核心层」（domain / app / infra），不卡总覆盖率：
# GUI 测试依赖 Tk，没有图形环境时会自动 skip，总覆盖率会从 86% 掉到 61%；
# 核心层覆盖率不受影响，稳定在 93%（813 条语句）。门禁设在 90%，留 3 个点余量。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 静态检查
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 用中间版本跑 lint / 类型检查：工具链兼容性最稳，不影响结论
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check src tests

      - name: mypy（strict，配置见 pyproject.toml）
        run: mypy

  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 下界（pyproject 的 requires-python）与本地开发版本各跑一遍
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 测试
        run: pytest -q --cov=rekindle --cov-report=term-missing

      - name: 核心层覆盖率门禁（domain / app / infra ≥ 90%）
        run: python -m coverage report --include="*/domain/*,*/app/*,*/infra/*" --fail-under=90
