# 持续集成：每次 push / PR 自动跑静态检查与测试。
#
# 支持范围 = Python 3.14，唯一来源是下面的 PYTHON_VERSION。
# 只测一个版本是刻意的：这是本地运行的桌面工具，不是供人 pip 安装的库，
# 测「实际运行的版本」比测「理论上兼容的版本」更有价值，也让 CI 与本地完全一致。
# 改版本时必须同步 pyproject.toml 的 requires-python（同一事实，两处引用）。
#
# 覆盖率门禁只卡「核心层」（domain / app / infra），不卡总覆盖率：
# GUI 测试依赖 Tk，没有图形环境时会自动 skip，总覆盖率会从 86% 掉到 61%；
# 核心层覆盖率不受影响，稳定在 93%（813 条语句）。门禁设在 90%，留 3 个点余量。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 静态检查
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 环境信息
        run: |
          python -V
          python -m pip --version
          python -m ruff --version
          python -m mypy --version

      - name: ruff
        run: ruff check src tests

      - name: mypy（strict，配置见 pyproject.toml）
        run: mypy

  test:
    name: 测试
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 测试
        run: pytest -q --cov=rekindle --cov-report=term-missing

      - name: 核心层覆盖率门禁（domain / app / infra ≥ 90%）
        run: python -m coverage report --include="*/domain/*,*/app/*,*/infra/*" --fail-under=90
